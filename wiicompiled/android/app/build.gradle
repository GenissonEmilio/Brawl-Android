plugins {
    id 'com.android.application'
}

def brawlAppId = providers.gradleProperty('brawlApplicationId').getOrElse('com.genisson.brawl.android')
def frontendOnly = providers.gradleProperty('brawlFrontendOnly').getOrElse('false').toBoolean()
if (frontendOnly && brawlAppId != 'com.genisson.brawl.android.validation') {
    throw new GradleException('View-only instrumentation requires the separate .validation application ID')
}

android {
    namespace 'com.wither.nsmbw'
    compileSdk 36

    defaultConfig {
        // A separate QA ID allows View instrumentation before the native/game build is staged.
        applicationId brawlAppId
        // Guest RAM uses memfd_create, which bionic has from Android 11 (API 30).
        minSdk 31
        targetSdk 36
        testInstrumentationRunner 'com.wither.nsmbw.TouchControlsInstrumentation'
        versionCode 2
        versionName '0.1.1-dev'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Personal builds: sign with the local debug key so the APK installs directly.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        // Release builds skip lint's vital checks: this machine builds offline, without lint's jars.
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // tools/stage-android.py stages the native build and runtime assets locally.
            jniLibs.srcDirs = frontendOnly ? [] : ['../native/jniLibs']
            assets.srcDirs = frontendOnly ? [] : ['../native/assets']
        }
    }

    packagingOptions {
        jniLibs {
            // Keep libmain.so uncompressed and page-aligned in the APK so it is mapped in place.
            useLegacyPackaging false
        }
    }
}
